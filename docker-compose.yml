version: "3.9"

# ===================================================================
#  Nexus - Docker Compose production stack
#  Includes: Nexus backend, Ollama, Searx
#
#  Start:   docker compose up -d
#  Stop:    docker compose down
#  Logs:    docker compose logs -f nexus
#  Shell:   docker compose exec nexus bash
# ===================================================================

services:

  # -- Nexus Backend ----------------------------------------------------------
  nexus:
    build: .
    container_name: nexus
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - SEARX_URL=http://searx:8080
      - DATA_DIR=/data
      - DEBUG=false
    env_file:
      - .env
    volumes:
      - nexus_data:/data
      - ./frontend:/app/frontend:ro
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # -- Ollama ----------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: nexus-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # -- Searx (self-hosted search) --------------------------------------------
  searx:
    image: searxng/searxng:latest
    container_name: nexus-searx
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      - searx_data:/etc/searxng
    environment:
      - SEARXNG_BASE_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3

  # -- Nginx reverse proxy ---------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: nexus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./scripts/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - nexus

volumes:
  nexus_data:
  ollama_data:
  searx_data:

networks:
  default:
    name: nexus-network
