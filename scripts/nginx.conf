# Nexus - Nginx reverse proxy configuration
# Place at: /etc/nginx/sites-available/nexus
# Enable: sudo ln -s /etc/nginx/sites-available/nexus /etc/nginx/sites-enabled/
# Reload: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name localhost;        # Replace with your domain or IP

    # -- Gzip compression ------------------------------------------------------
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml;
    gzip_min_length 1000;

    # -- Security headers ------------------------------------------------------
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin";

    # -- SSE / Streaming (no buffering!) ---------------------------------------
    location ~ ^/api/(chat|agents|research|models/pull) {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;

        # Critical for SSE streaming - disable all buffering
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     600s;
        proxy_send_timeout     600s;
        chunked_transfer_encoding on;

        # SSE headers
        proxy_set_header Connection '';
        add_header Cache-Control no-cache;
        add_header X-Accel-Buffering no;
    }

    # -- Regular API -----------------------------------------------------------
    location /api/ {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 120s;
        client_max_body_size 50M;
    }

    # -- Static frontend -------------------------------------------------------
    location / {
        proxy_pass         http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_cache_valid  200 1h;
    }
}

